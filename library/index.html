<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Book Sale">
<meta name="color-scheme" content="light">
<title>Book Sale</title>
<style>
/* Book sale calculator: "the price sheet, made tappable".
   Each price is one ruled line, like the printed sheet, with its buttons on the same line.
   Structure has square edges; anything you tap has 6px corners; only the phone keypad panel
   (it floats) is rounder.

   Sizes: iPad Pro 11" is 1194 x 834 (landscape) / 834 x 1194 (portrait), less Safari toolbars.
   The iPad never scrolls; app.js (planLayout) picks columns and one- or two-line rows from
   the --row-* sizes below, so keep them in sync with the .line / .column-head rules.
   Phones (< 600px wide or < 500px tall) scroll the price list instead. */

:root {
  --paper: #ffffff;
  --ground: #eef2f0;
  --ink: #16222c;
  --ink-soft: #56636c;
  --ink-faint: #a9b2ad;
  --rule: #d5dcd8;
  --buckram: #0f5c57;       /* library binding cloth: add */
  --buckram-wash: #dcece8;
  --stamp: #5a3f8e;         /* date-due stamp ink: remove */
  --stamp-wash: #ebe6f3;
  --key-edge: #c2cbc6;
  --band-soft: #a7b6c0;
  --warn: #f2c865;

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --radius: 6px;
  --side-width: 380px;
  --amount-size: 68px;
  --key-height: 54px;
  --entry-height: 56px;

  /* Read by app.js. */
  --row-single: 48px;
  --row-double: 84px;
  --row-heading: 34px;
  --single-row-min-width: 680px;

  color-scheme: light;
  font-family: var(--font-ui);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--ground);
}

body {
  position: fixed;
  inset: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

h1, h2 { margin: 0; }

button {
  font: inherit;
  color: inherit;
  border: 0;
  margin: 0;
  padding: 0;
  background: none;
  touch-action: manipulation;
  cursor: pointer;
  transition: transform 60ms ease, filter 60ms ease;
}
button:active:not(:disabled) { transform: scale(0.95); filter: brightness(0.9); }
button:disabled { cursor: default; opacity: 0.3; }
button:focus-visible { outline: 3px solid var(--buckram); outline-offset: 2px; }

.app {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--side-width);
  grid-template-areas: "items side";
  padding:
    env(safe-area-inset-top, 0px)
    env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px)
    env(safe-area-inset-left, 0px);
}

/* ---- Price list ---- */

.items {
  grid-area: items;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: grid;
  grid-template-columns: repeat(var(--columns, 1), minmax(0, 1fr));
  align-items: stretch;
  background: var(--paper);
}

.column {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.column + .column { border-left: 1px solid var(--rule); }

.column-head {
  flex: none;
  height: var(--row-heading);
  display: flex;
  align-items: flex-end;
  padding: 0 16px 5px;
  background: var(--ground);
  border-bottom: 2px solid var(--ink);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* One-line row: name ... price  -10 -5 -1  qty  +1 +5 +10 */
.line {
  flex: 1 1 0;
  min-height: var(--row-single);
  max-height: 64px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 2px 12px 1px 16px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
}
.line.in-cart {
  background: var(--buckram-wash);
  box-shadow: inset 5px 0 0 var(--buckram);
}

.line-head {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.line-name {
  flex: 1;
  min-width: 0;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.line-price {
  flex: none;
  font-family: var(--font-num);
  font-size: 19px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
}
.line.in-cart .line-price { color: var(--ink); }

.line-controls {
  flex: none;
  width: 392px;
  height: 44px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.4fr) repeat(3, minmax(0, 1fr));
  gap: 4px;
}

/* Two-line row, for narrow columns: name and price above, buttons below. */
.items[data-rows="double"] .line {
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 6px;
  min-height: var(--row-double);
  max-height: 112px;
  padding: 6px 12px;
}
.items[data-rows="double"] .line-controls { width: auto; }
.items[data-rows="double"] .line-name,
.items[data-rows="double"] .line-price { font-size: 17px; }

.step {
  border-radius: var(--radius);
  font-family: var(--font-num);
  font-size: 17px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.step.plus { background: var(--buckram); color: #fff; }
.step.minus { background: var(--stamp-wash); color: var(--stamp); }
.step.minus:disabled { opacity: 1; background: transparent; color: #c3c9c5; }

.qty {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-num);
  font-size: 26px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink-faint);
}
.line.in-cart .qty { color: var(--ink); }

.bump { animation: bump 180ms ease-out; }
@keyframes bump {
  40% { transform: scale(1.15); }
}

/* ---- Side: total band + custom price ---- */

.side {
  grid-area: side;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--rule);
  background: var(--ground);
}

.band {
  flex: none;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "title title"
    "warn warn"
    "amount amount"
    "count new";
  align-items: center;
  column-gap: 12px;
  padding: 12px 16px 14px;
  background: var(--ink);
  color: #fff;
}
.band button:focus-visible { outline-color: #fff; }
.band-title {
  grid-area: title;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--band-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.warnings {
  grid-area: warn;
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--warn);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.total-amount {
  grid-area: amount;
  margin: 2px 0 6px;
  font-family: var(--font-num);
  font-size: var(--amount-size);
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.total-count {
  grid-area: count;
  font-family: var(--font-num);
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  color: var(--band-soft);
  white-space: nowrap;
}
.btn-new {
  grid-area: new;
  height: 48px;
  padding: 0 20px;
  border-radius: var(--radius);
  background: #fff;
  color: var(--ink);
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap;
}

.custom-panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 16px 16px;
  background: var(--ground);
}
.custom-head {
  flex: none;
  min-height: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.custom-title {
  font-size: 17px;
  font-weight: 700;
}

.entry-row {
  flex: none;
  height: var(--entry-height);
  display: flex;
  gap: 8px;
}
.entry {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 12px;
  background: var(--paper);
  border-bottom: 3px solid var(--ink);
  font-family: var(--font-num);
  font-size: 38px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.entry.is-zero { color: var(--ink-faint); border-bottom-color: var(--key-edge); }
.entry-clear {
  flex: none;
  width: 76px;
  border-radius: var(--radius);
  background: var(--stamp-wash);
  color: var(--stamp);
  font-size: 17px;
  font-weight: 700;
}

.keypad {
  flex: none;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: var(--key-height);
  gap: 6px;
}
.key {
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: inset 0 -3px 0 var(--key-edge);
  font-family: var(--font-num);
  font-size: 26px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.key:active:not(:disabled) { box-shadow: inset 0 -1px 0 var(--key-edge); }

.btn-add {
  flex: none;
  height: 52px;
  border-radius: var(--radius);
  background: var(--buckram);
  color: #fff;
  font-size: 18px;
  font-weight: 700;
}

.custom-list {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: 50px;
  column-gap: 14px;
  align-content: start;
  /* Only reachable with an unusual number of distinct custom prices. */
  overflow-y: auto;
}
.custom-list:empty::before {
  content: attr(data-empty);
  grid-column: 1 / -1;
  align-self: center;
  color: var(--ink-soft);
  font-size: 15px;
}
.custom-item {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--font-num);
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.custom-item span {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.custom-item .step {
  flex: none;
  width: 52px;
  height: 44px;
}

/* Phone-only controls (see the phone section). */
.custom-close,
.custom-toggle,
.sheet-backdrop { display: none; }

/* ---- Overlays ---- */

.toast {
  position: fixed;
  z-index: 30;
  left: calc((100vw - var(--side-width)) / 2);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: calc(100vw - 24px);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 8px 8px 20px;
  border-radius: 8px;
  background: var(--ink);
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(22, 34, 44, 0.3);
}
.toast-undo {
  height: 44px;
  padding: 0 22px;
  border-radius: var(--radius);
  background: #fff;
  color: var(--ink);
  font-weight: 700;
}
.toast-undo:focus-visible { outline-color: #fff; }

.fatal {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 12px;
  padding: 40px max(40px, calc((100vw - 40em) / 2));
  background: var(--paper);
  font-size: 20px;
  line-height: 1.45;
  -webkit-user-select: text;
  user-select: text;
}
.fatal h2 { font-size: 28px; }
.fatal p { margin: 0; max-width: 40em; }

/* ---- iPad landscape with Safari toolbars (~750px tall) ---- */
@media (max-height: 800px) and (orientation: landscape) {
  :root {
    --amount-size: 56px;
    --key-height: 48px;
    --entry-height: 50px;
  }
  .band { padding: 10px 16px 12px; }
  .custom-panel { gap: 8px; padding: 10px 16px 14px; }
  .entry { font-size: 32px; }
}

/* ---- iPad portrait: band / price list / keypad, stacked ---- */
@media (orientation: portrait) {
  :root {
    --amount-size: 50px;
    --key-height: 46px;
    --entry-height: 50px;
  }
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "band" "items" "custom";
  }
  .side { display: contents; }

  .band {
    grid-area: band;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "title title title"
      "warn warn warn"
      "amount count new";
    align-items: baseline;
    padding: 10px 16px 10px;
  }
  .total-amount { margin: 0; }
  .btn-new { align-self: center; height: 52px; padding: 0 28px; }

  .custom-panel {
    grid-area: custom;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas:
      "head add"
      "entry add"
      "keypad list";
    gap: 8px 16px;
    border-top: 1px solid var(--rule);
  }
  .custom-head { grid-area: head; }
  .entry-row { grid-area: entry; }
  .entry { font-size: 32px; }
  .keypad { grid-area: keypad; }
  .btn-add { grid-area: add; height: auto; }
  /* Size to the keypad's row instead of growing it with many custom prices. */
  .custom-list { grid-area: list; contain: size; }

  .toast {
    left: 50%;
    top: calc(10px + env(safe-area-inset-top, 0px));
    bottom: auto;
  }
}

/* ---- Phones: pinned band, scrolling price list, keypad in a slide-up sheet ---- */
@media (max-width: 600px), (max-height: 500px) {
  :root {
    --amount-size: 36px;
    --key-height: 52px;
    --entry-height: 52px;
  }
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "band" "items" "toggle";
  }
  .side { display: contents; }

  .band {
    grid-area: band;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "title title"
      "warn warn"
      "amount new"
      "count new";
    align-items: center;
    padding: 8px 12px 10px 16px;
  }
  .band-title { font-size: 13px; }
  .total-amount { margin: 0; line-height: 1.15; }
  .total-count { font-size: 15px; }
  .btn-new { height: 48px; padding: 0 16px; }

  .items {
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    align-content: start;
  }
  .column { min-height: auto; }
  .column-head { position: sticky; top: 0; z-index: 1; }
  .line { flex: none; max-height: none; }

  .custom-toggle {
    grid-area: toggle;
    display: block;
    height: calc(54px + env(safe-area-inset-bottom, 0px));
    margin:
      0
      calc(-1 * env(safe-area-inset-right, 0px))
      calc(-1 * env(safe-area-inset-bottom, 0px))
      calc(-1 * env(safe-area-inset-left, 0px));
    padding: 0 16px env(safe-area-inset-bottom, 0px);
    background: var(--buckram);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .custom-toggle:active:not(:disabled) { transform: none; }

  .sheet-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(22, 34, 44, 0.4);
  }

  .custom-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    max-height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding:
      14px
      calc(16px + env(safe-area-inset-right, 0px))
      calc(16px + env(safe-area-inset-bottom, 0px))
      calc(16px + env(safe-area-inset-left, 0px));
    border: 0;
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -12px 32px rgba(22, 34, 44, 0.28);
    transform: translateY(105%);
    visibility: hidden;
    transition: transform 200ms ease, visibility 0s linear 200ms;
  }
  .custom-panel.open {
    transform: none;
    visibility: visible;
    transition: transform 200ms ease;
  }
  .custom-close {
    display: block;
    height: 44px;
    padding: 0 22px;
    border-radius: var(--radius);
    background: var(--ink);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
  }
  .btn-add { height: 52px; }
  .custom-list {
    flex: none;
    contain: none;
    max-height: 150px; /* three rows; more scroll inside the sheet */
  }
  .custom-list:empty { display: none; }

  .toast {
    left: 50%;
    top: calc(10px + env(safe-area-inset-top, 0px));
    bottom: auto;
  }
}

/* Phone held sideways: one short band, and the keypad beside its list. */
@media (max-height: 500px) {
  :root { --key-height: 44px; }
  .band {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "warn warn warn"
      "amount count new";
    align-items: baseline;
    padding: 6px 12px 6px 16px;
  }
  .band-title { display: none; }
  .total-amount { font-size: 32px; }
  .btn-new { align-self: center; }

  .custom-panel {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas:
      "head head"
      "entry add"
      "keypad list";
    align-items: start;
    gap: 8px 16px;
  }
  .custom-head { grid-area: head; }
  .entry-row { grid-area: entry; }
  .keypad { grid-area: keypad; gap: 4px; }
  .btn-add { grid-area: add; }
  .custom-list { grid-area: list; max-height: 200px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <main id="items" class="items" aria-label="Price list"></main>

  <aside class="side">
    <section class="band" aria-label="Cart total">
      <h1 id="title" class="band-title"></h1>
      <p id="warnings" class="warnings" hidden></p>
      <div id="total" class="total-amount" aria-live="polite">$0.00</div>
      <div id="count" class="total-count">0 items</div>
      <button id="new-customer" class="btn-new" type="button">New customer</button>
    </section>

    <section id="custom-panel" class="custom-panel" aria-label="Custom price">
      <div class="custom-head">
        <h2 class="custom-title">Custom price</h2>
        <button id="custom-close" class="custom-close" type="button">Done</button>
      </div>
      <div class="entry-row">
        <output id="entry" class="entry">$0.00</output>
        <button id="entry-clear" class="entry-clear" type="button" aria-label="Clear custom price">Clear</button>
      </div>
      <div id="keypad" class="keypad"></div>
      <button id="add-custom" class="btn-add" type="button" disabled>Enter a price</button>
      <ul id="custom-list" class="custom-list" data-empty="Books added at a custom price are listed here"></ul>
    </section>

    <!-- Phones only: opens the custom-price panel as a slide-up sheet. -->
    <button id="custom-toggle" class="custom-toggle" type="button" aria-controls="custom-panel" aria-expanded="false">Custom price</button>
  </aside>
</div>

<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

<div id="toast" class="toast" role="status" hidden>
  <span>Cart cleared</span>
  <button id="undo" class="toast-undo" type="button">Undo</button>
</div>

<div id="fatal" class="fatal" role="alert" hidden></div>

<script>window.BOOKSALE_DATA = {"csv":"category,description,price\nChildren's,Board Books,1.00\nChildren's,Softcover,1.00\nChildren's,Golden Books,1.00\nChildren's,Large Hardcover Picture Books,2.00\nChildren's,Adult-Sized Hardcover,2.00\nChildren's,Extra Small Softcover,free\nAdults,Hardbound,2.00\nAdults,Trade Paper,1.50\nAdults,Mass Market Paper,1.00\nAudio/Visual,Audiobooks,1.00\nAudio/Visual,\"DVDs ($1 per disc, max $5 per set)\",1.00\nAudio/Visual,\"CDs ($1 per disc, max $5 per set)\",1.00\n","config":{"title":"Friends of the Fanwood Library Book Sale"}};</script>
<script>
// Pure logic shared by the browser app, the build script, and the tests.
// No DOM access in here. All money is integer cents.
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.BookSale = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DEFAULT_TITLE = 'Library Book Sale';
  const MAX_QTY = 999;
  const MAX_ENTRY_DIGITS = 6; // $9,999.99
  const REQUIRED_COLUMNS = ['category', 'description', 'price'];
  // A category heading takes roughly a quarter of a card's height.
  const HEADER_COST = 0.25;

  // RFC 4180-ish: quoted fields, doubled quotes, CRLF/LF, leading BOM.
  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    let i = text.charCodeAt(0) === 0xfeff ? 1 : 0;
    for (; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c !== '"') field += c;
        else if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field);
        field = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else {
        field += c;
      }
    }
    if (field !== '' || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter((r) => r.some((f) => f.trim() !== ''));
  }

  // "0.75" -> 75, "$2" -> 200, "1.5" -> 150, "free" -> 0. Anything else -> null.
  // Parsed as a string so no float ever touches the money path.
  function parsePriceCents(value) {
    const text = String(value).trim();
    if (/^free$/i.test(text)) return 0;
    const m = /^\$?(\d*)(?:\.(\d{0,2}))?$/.exec(text);
    if (!m || (m[1] === '' && !m[2])) return null;
    return Number(m[1] || '0') * 100 + Number((m[2] || '').padEnd(2, '0'));
  }

  function formatPrice(cents) {
    return cents === 0 ? 'Free' : formatCents(cents);
  }

  function formatCents(cents) {
    const sign = cents < 0 ? '-' : '';
    const abs = Math.abs(cents);
    const dollars = Math.floor(abs / 100).toLocaleString('en-US');
    return `${sign}$${dollars}.${String(abs % 100).padStart(2, '0')}`;
  }

  function loadPriceTable(csvText) {
    const rows = parseCsv(csvText);
    if (!rows.length) throw new Error('the file is empty');
    const header = rows[0].map((h) => h.trim().toLowerCase());
    const missing = REQUIRED_COLUMNS.filter((c) => !header.includes(c));
    if (missing.length) {
      throw new Error(`missing column(s): ${missing.join(', ')}. The first line must be "category,description,price"`);
    }
    const col = Object.fromEntries(REQUIRED_COLUMNS.map((c) => [c, header.indexOf(c)]));

    const items = [];
    const warnings = [];
    const seen = new Set();
    rows.slice(1).forEach((r, idx) => {
      const line = idx + 2;
      const category = (r[col.category] || '').trim() || 'Other';
      const description = (r[col.description] || '').trim();
      const rawPrice = (r[col.price] || '').trim();
      const cents = parsePriceCents(rawPrice);
      if (!description) {
        warnings.push(`price_table.csv line ${line}: no description, skipped`);
        return;
      }
      if (cents === null) {
        warnings.push(`price_table.csv line ${line}: price "${rawPrice}" is not a valid amount, skipped`);
        return;
      }
      const id = JSON.stringify([category, description, cents]);
      if (seen.has(id)) {
        warnings.push(`price_table.csv line ${line}: duplicate of an earlier row, skipped`);
        return;
      }
      seen.add(id);
      items.push({ id, category, description, cents });
    });
    return { items, warnings };
  }

  function normalizeConfig(raw) {
    const warnings = [];
    const config = { title: DEFAULT_TITLE };
    if (raw == null) return { config, warnings };
    if (typeof raw !== 'object' || Array.isArray(raw)) {
      warnings.push('config.json should contain a { ... } object; using defaults');
      return { config, warnings };
    }
    if (raw.title !== undefined) {
      if (typeof raw.title === 'string' && raw.title.trim()) config.title = raw.title.trim();
      else warnings.push('config.json "title" should be non-empty text; using the default');
    }
    return { config, warnings };
  }

  // Preserves the order categories first appear in the CSV.
  function groupByCategory(items) {
    const groups = new Map();
    for (const item of items) {
      if (!groups.has(item.category)) groups.set(item.category, []);
      groups.get(item.category).push(item);
    }
    return [...groups].map(([category, groupItems]) => ({ category, items: groupItems }));
  }

  // Lays categories out into columns so the grid grows sideways, never downward.
  // `capacity` and `headerCost` are measured in rows: each item costs 1 and each
  // category heading costs `headerCost`. Long categories are split into balanced
  // chunks; short consecutive ones share a column, in CSV order.
  function layoutColumns(groups, capacity, headerCost = HEADER_COST) {
    if (!Number.isFinite(capacity)) {
      return [{ sections: groups.map(({ category, items }) => ({ category, continued: false, items })) }];
    }
    const maxCards = Math.max(1, Math.floor(capacity - headerCost));
    const chunks = [];
    for (const { category, items } of groups) {
      const count = Math.ceil(items.length / maxCards);
      const size = Math.ceil(items.length / count);
      for (let c = 0; c < count; c++) {
        chunks.push({ category, continued: c > 0, items: items.slice(c * size, (c + 1) * size) });
      }
    }

    const columns = [];
    let used = Infinity;
    for (const chunk of chunks) {
      const cost = chunk.items.length + headerCost;
      if (used + cost > capacity + 1e-9) {
        columns.push({ sections: [] });
        used = 0;
      }
      columns[columns.length - 1].sections.push(chunk);
      used += cost;
    }
    return columns;
  }

  const MAX_PLANNED_COLUMNS = 4;

  // Chooses how the price list is laid out in a box of `width` x `height` px.
  // `metrics` are the CSS minimums: row heights for one-line (`single`) and
  // two-line (`double`) rows, the heading height, and the narrowest column that
  // still fits a one-line row. Prefers the fewest columns; a column narrower
  // than `singleMinWidth` uses two-line rows. With `scroll`, height is ignored
  // and everything goes in one column.
  function planLayout(groups, { width, height, scroll = false }, metrics) {
    const rowsFor = (columnCount) => (width / columnCount >= metrics.singleMinWidth ? 'single' : 'double');
    if (scroll) return { rows: rowsFor(1), columns: layoutColumns(groups, Infinity) };

    let plan = null;
    for (let n = 1; n <= MAX_PLANNED_COLUMNS; n++) {
      const rowHeight = metrics[rowsFor(n)];
      const columns = layoutColumns(groups, height / rowHeight, metrics.heading / rowHeight);
      plan = { rows: rowsFor(columns.length), columns };
      if (columns.length <= n) break;
    }
    return plan;
  }

  // Cart: { counts: { [itemId]: qty }, custom: [{ cents, qty }] }, newest custom price first.
  function emptyCart() {
    return { counts: {}, custom: [] };
  }

  function clampQty(n) {
    return Math.max(0, Math.min(MAX_QTY, n));
  }

  function adjustItem(cart, id, delta) {
    const counts = { ...cart.counts };
    const qty = clampQty((counts[id] || 0) + delta);
    if (qty) counts[id] = qty;
    else delete counts[id];
    return { ...cart, counts };
  }

  function adjustCustom(cart, cents, delta) {
    if (!(cents > 0)) return cart;
    const existing = cart.custom.find((c) => c.cents === cents);
    const qty = clampQty((existing ? existing.qty : 0) + delta);
    const rest = cart.custom.filter((c) => c.cents !== cents);
    if (!qty) return { ...cart, custom: rest };
    if (existing) return { ...cart, custom: cart.custom.map((c) => (c.cents === cents ? { cents, qty } : c)) };
    return { ...cart, custom: [{ cents, qty }, ...rest] };
  }

  function cartSummary(cart, items) {
    let itemCount = 0;
    let totalCents = 0;
    for (const item of items) {
      const qty = cart.counts[item.id] || 0;
      itemCount += qty;
      totalCents += qty * item.cents;
    }
    for (const { cents, qty } of cart.custom) {
      itemCount += qty;
      totalCents += qty * cents;
    }
    return { itemCount, totalCents };
  }

  function isEmptyCart(cart) {
    return !Object.keys(cart.counts).length && !cart.custom.length;
  }

  // Rebuilds a cart from untrusted storage, dropping anything that no longer
  // matches the current price table.
  function sanitizeCart(raw, items) {
    const cart = emptyCart();
    if (!raw || typeof raw !== 'object') return cart;
    const known = new Set(items.map((i) => i.id));
    for (const [id, qty] of Object.entries(raw.counts || {})) {
      if (known.has(id) && Number.isInteger(qty) && qty > 0) cart.counts[id] = clampQty(qty);
    }
    if (Array.isArray(raw.custom)) {
      for (const entry of raw.custom) {
        if (!entry || !Number.isInteger(entry.cents) || !Number.isInteger(entry.qty)) continue;
        if (entry.cents <= 0 || entry.qty <= 0 || cart.custom.some((c) => c.cents === entry.cents)) continue;
        cart.custom.push({ cents: entry.cents, qty: clampQty(entry.qty) });
      }
    }
    return cart;
  }

  // Cash-register entry: digits shift in from the right, so 3-5-0 is $3.50.
  function pressKey(digits, key) {
    if (key === 'clear') return '';
    if (key === 'back') return digits.slice(0, -1);
    if (!/^\d+$/.test(key)) return digits;
    const next = (digits + key).replace(/^0+/, '');
    return next.length > MAX_ENTRY_DIGITS ? digits : next;
  }

  function entryToCents(digits) {
    return digits ? Number(digits) : 0;
  }

  return {
    DEFAULT_TITLE,
    MAX_QTY,
    MAX_ENTRY_DIGITS,
    parseCsv,
    parsePriceCents,
    formatCents,
    formatPrice,
    loadPriceTable,
    normalizeConfig,
    groupByCategory,
    layoutColumns,
    planLayout,
    emptyCart,
    adjustItem,
    adjustCustom,
    cartSummary,
    isEmptyCart,
    sanitizeCart,
    pressKey,
    entryToCents,
  };
});
</script>
<script>
// UI layer. All pricing and cart rules live in lib.js (window.BookSale).
(function () {
  'use strict';

  const B = window.BookSale;
  const STORAGE_KEY = 'booksale.cart.v1';
  // Row sizes live in styles.css; the layout planner reads them from there.
  const METRIC_VARS = {
    single: '--row-single',
    double: '--row-double',
    heading: '--row-heading',
    singleMinWidth: '--single-row-min-width',
  };
  const UNDO_MS = 8000;
  const STEPS = [-10, -5, -1, 1, 5, 10];
  const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'back'];

  const $ = (id) => document.getElementById(id);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function stepLabel(step) {
    return step < 0 ? `−${-step}` : `+${step}`;
  }

  let items = [];
  let cart = B.emptyCart();
  let entry = '';
  let undo = null; // { cart, timer }
  let groups = [];
  let lines = []; // parallel to items: { line, qty, minus[] }
  let layoutKey = '';

  // ---- data ----

  async function loadData() {
    if (window.BOOKSALE_DATA) return { ...window.BOOKSALE_DATA, warnings: [] };

    const warnings = [];
    const csvRes = await fetch('data/price_table.csv', { cache: 'no-store' });
    if (!csvRes.ok) throw new Error(`data/price_table.csv returned HTTP ${csvRes.status}`);
    const csv = await csvRes.text();

    let config = null;
    try {
      const cfgRes = await fetch('data/config.json', { cache: 'no-store' });
      if (cfgRes.ok) config = JSON.parse(await cfgRes.text());
      else warnings.push('data/config.json not found; using defaults');
    } catch (err) {
      warnings.push(`data/config.json could not be read (${err.message}); using defaults`);
    }
    return { csv, config, warnings };
  }

  function saveCart() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
    } catch (_) {
      // Private browsing or storage disabled: the cart just won't survive a reload.
    }
  }

  function restoreCart() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? B.sanitizeCart(JSON.parse(raw), items) : B.emptyCart();
    } catch (_) {
      return B.emptyCart();
    }
  }

  // ---- state changes ----

  function setCart(next) {
    if (next === cart) return;
    cart = next;
    dismissUndo();
    saveCart();
    render();
  }

  function setEntry(next) {
    entry = next;
    renderEntry();
  }

  function newCustomer() {
    if (B.isEmptyCart(cart)) return;
    const previous = cart;
    setCart(B.emptyCart());
    setEntry('');
    undo = { cart: previous, timer: setTimeout(dismissUndo, UNDO_MS) };
    $('toast').hidden = false;
  }

  function undoClear() {
    if (!undo) return;
    const previous = undo.cart;
    dismissUndo();
    setCart(previous);
  }

  function dismissUndo() {
    if (!undo) return;
    clearTimeout(undo.timer);
    undo = null;
    $('toast').hidden = true;
  }

  // Phones only; on larger screens the panel is always visible and these are hidden.
  function setSheet(open) {
    $('custom-panel').classList.toggle('open', open);
    $('sheet-backdrop').hidden = !open;
    $('custom-toggle').setAttribute('aria-expanded', String(open));
  }

  function isSheetOpen() {
    return $('custom-panel').classList.contains('open');
  }

  function addCustom() {
    const cents = B.entryToCents(entry);
    if (!cents) return;
    setCart(B.adjustCustom(cart, cents, 1));
    setEntry('');
  }

  // ---- building the static UI ----

  function readMetrics() {
    const style = getComputedStyle(document.documentElement);
    const metrics = {};
    for (const [key, name] of Object.entries(METRIC_VARS)) metrics[key] = parseFloat(style.getPropertyValue(name));
    return metrics;
  }

  // Picks columns and one- or two-line rows for the space available, and
  // rebuilds the list only when that choice changes (e.g. on rotation).
  function layoutItems() {
    const container = $('items');
    const plan = B.planLayout(
      groups,
      {
        width: container.clientWidth,
        height: container.clientHeight,
        scroll: getComputedStyle(container).overflowY === 'auto',
      },
      readMetrics()
    );
    const key = JSON.stringify([plan.rows, plan.columns.map((c) => c.sections.map((s) => s.items.length))]);
    if (key === layoutKey) return;
    layoutKey = key;

    lines = [];
    container.dataset.rows = plan.rows;
    container.style.setProperty('--columns', plan.columns.length);
    container.replaceChildren(
      ...plan.columns.map((column) => {
        const node = el('div', 'column');
        for (const section of column.sections) {
          const heading = section.continued ? `${section.category} (cont.)` : section.category;
          const head = el('h2', 'column-head', heading);
          head.title = heading;
          node.append(head, ...section.items.map(buildLine));
        }
        return node;
      })
    );
    render();
  }

  function buildLine(item) {
    const index = items.indexOf(item);
    const qtyNow = cart.counts[item.id] || 0;
    const line = el('div', 'line');
    const head = el('div', 'line-head');
    head.append(el('div', 'line-name', item.description), el('div', 'line-price', B.formatPrice(item.cents)));

    const controls = el('div', 'line-controls');
    const qty = el('div', 'qty', String(qtyNow));
    qty.setAttribute('aria-label', `${item.description} quantity`);
    const minus = [];
    for (const step of STEPS) {
      if (step === 1) controls.append(qty);
      const button = el('button', `step ${step < 0 ? 'minus' : 'plus'}`, stepLabel(step));
      button.type = 'button';
      button.dataset.index = index;
      button.dataset.step = step;
      button.setAttribute('aria-label', `${step < 0 ? 'Remove' : 'Add'} ${Math.abs(step)}: ${item.description}`);
      if (step < 0) minus.push(button);
      controls.append(button);
    }

    line.append(head, controls);
    lines[index] = { line, qty, minus };
    return line;
  }

  function buildKeypad() {
    const pad = $('keypad');
    for (const key of KEYS) {
      const button = el('button', 'key', key === 'back' ? '⌫' : key);
      button.type = 'button';
      button.dataset.key = key;
      if (key === 'back') button.setAttribute('aria-label', 'Backspace');
      pad.append(button);
    }
    pad.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-key]');
      if (button) setEntry(B.pressKey(entry, button.dataset.key));
    });

    $('entry-clear').addEventListener('click', () => setEntry(''));
    $('custom-toggle').addEventListener('click', () => setSheet(true));
    $('custom-close').addEventListener('click', () => setSheet(false));
    $('sheet-backdrop').addEventListener('click', () => setSheet(false));
    $('add-custom').addEventListener('click', addCustom);

    $('custom-list').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-cents]');
      if (button) setCart(B.adjustCustom(cart, Number(button.dataset.cents), Number(button.dataset.step)));
    });

    // Hardware keyboard, handy when testing on a laptop.
    document.addEventListener('keydown', (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (/^\d$/.test(event.key)) setEntry(B.pressKey(entry, event.key));
      else if (event.key === 'Backspace') setEntry(B.pressKey(entry, 'back'));
      else if (event.key === 'Escape') isSheetOpen() ? setSheet(false) : setEntry('');
      else if (event.key === 'Enter') addCustom();
      else return;
      event.preventDefault();
    });
  }

  // ---- rendering ----

  function bump(node) {
    node.classList.remove('bump');
    void node.offsetWidth; // restart the animation
    node.classList.add('bump');
  }

  function render() {
    items.forEach((item, i) => {
      const ref = lines[i];
      if (!ref) return;
      const qty = cart.counts[item.id] || 0;
      if (ref.qty.textContent !== String(qty)) {
        ref.qty.textContent = qty;
        bump(ref.qty);
      }
      ref.line.classList.toggle('in-cart', qty > 0);
      for (const button of ref.minus) button.disabled = qty === 0;
    });

    const { itemCount, totalCents } = B.cartSummary(cart, items);
    const total = $('total');
    const totalText = B.formatCents(totalCents);
    if (total.textContent !== totalText) {
      total.textContent = totalText;
      bump(total);
    }
    $('count').textContent = `${itemCount} item${itemCount === 1 ? '' : 's'}`;
    $('new-customer').disabled = itemCount === 0;

    renderCustomList();
    renderCustomToggle();
  }

  function renderCustomToggle() {
    let count = 0;
    let cents = 0;
    for (const line of cart.custom) {
      count += line.qty;
      cents += line.qty * line.cents;
    }
    $('custom-toggle').textContent = count
      ? `Custom price (${count} book${count === 1 ? '' : 's'}, ${B.formatCents(cents)})`
      : 'Custom price';
  }

  function renderCustomList() {
    const list = $('custom-list');
    list.replaceChildren(
      ...cart.custom.map(({ cents, qty }) => {
        const price = B.formatCents(cents);
        const row = el('li', 'custom-item');
        const remove = el('button', 'step minus', stepLabel(-1));
        remove.type = 'button';
        remove.dataset.cents = cents;
        remove.dataset.step = -1;
        remove.setAttribute('aria-label', `Remove one ${price} book`);
        row.append(el('span', null, qty > 1 ? `${price} \u00D7${qty}` : price), remove);
        return row;
      })
    );
  }

  function renderEntry() {
    const cents = B.entryToCents(entry);
    const display = $('entry');
    display.textContent = B.formatCents(cents);
    display.classList.toggle('is-zero', cents === 0);
    const add = $('add-custom');
    add.disabled = cents === 0;
    add.textContent = cents ? `Add ${B.formatCents(cents)} book` : 'Enter a price';
  }

  function showWarnings(warnings) {
    if (!warnings.length) return;
    for (const w of warnings) console.warn(`[booksale] ${w}`);
    const node = $('warnings');
    node.textContent = warnings.length === 1 ? warnings[0] : `${warnings[0]} (+${warnings.length - 1} more)`;
    node.title = warnings.join('\n');
    node.hidden = false;
  }

  function showFatal(message) {
    const node = $('fatal');
    const parts = [el('h2', null, 'The calculator could not start'), el('p', null, message)];
    if (location.protocol === 'file:' && !window.BOOKSALE_DATA) {
      parts.push(el('p', null,
        'This page was opened directly from disk. Run "npm start" to use it from src/, ' +
        'or run "npm run build" and open dist/index.html instead.'));
    }
    node.replaceChildren(...parts);
    node.hidden = false;
  }

  // ---- screen wake lock (keeps the iPad awake during the sale where supported) ----

  let wakeLock = null;
  async function keepAwake() {
    if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (_) {
      // Needs a secure context and a user gesture on some browsers; not essential.
    }
  }

  // ---- boot ----

  async function init() {
    document.addEventListener('gesturestart', (event) => event.preventDefault());

    let data;
    let table;
    try {
      data = await loadData();
    } catch (err) {
      showFatal(`Could not load the price list: ${err.message}`);
      return;
    }
    try {
      table = B.loadPriceTable(data.csv);
    } catch (err) {
      showFatal(`Problem with data/price_table.csv: ${err.message}`);
      return;
    }
    if (!table.items.length) {
      showFatal('data/price_table.csv has no usable rows.');
      return;
    }

    const { config, warnings: configWarnings } = B.normalizeConfig(data.config);
    items = table.items;
    document.title = config.title;
    $('title').textContent = config.title;
    showWarnings([...data.warnings, ...configWarnings, ...table.warnings]);

    groups = B.groupByCategory(items);
    cart = restoreCart();

    const container = $('items');
    container.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-index]');
      if (!button) return;
      const item = items[Number(button.dataset.index)];
      setCart(B.adjustItem(cart, item.id, Number(button.dataset.step)));
    });
    layoutItems();
    if ('ResizeObserver' in window) {
      let frame = 0;
      new ResizeObserver(() => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(layoutItems);
      }).observe(container);
    } else {
      window.addEventListener('resize', layoutItems);
    }

    buildKeypad();
    $('new-customer').addEventListener('click', newCustomer);
    $('undo').addEventListener('click', undoClear);

    render();
    renderEntry();

    keepAwake();
    document.addEventListener('pointerdown', keepAwake);
    document.addEventListener('visibilitychange', keepAwake);
  }

  init();
})();
</script>
</body>
